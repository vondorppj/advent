<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Advent Calendar · for my love</title>
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="For my love">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="verrouille">
  <div class="verrou-ecran" id="verrou">
    <div class="coeur-chrome" id="coeur" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <defs>
          <linearGradient id="chromeG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6f6f6"/><stop offset=".2" stop-color="#a9adb2"/>
            <stop offset=".38" stop-color="#ffffff"/><stop offset=".55" stop-color="#7f8389"/>
            <stop offset=".72" stop-color="#e6e7e8"/><stop offset=".88" stop-color="#9ea2a7"/><stop offset="1" stop-color="#f4f4f4"/>
            <animateTransform attributeName="gradientTransform" type="translate" values="-.25 -.25; .25 .25; -.25 -.25" dur="6s" repeatCount="indefinite"/>
          </linearGradient>
          <linearGradient id="refletG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M12 21.2s-7.6-4.7-9.6-9.4C1 8.4 3.2 4.4 7 4.4c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.8 0 6 4 4.6 7.4-2 4.7-9.6 9.4-9.6 9.4z" fill="url(#chromeG)" stroke="rgba(0,0,0,.18)" stroke-width=".25"/>
        <ellipse cx="7.4" cy="8.2" rx="2.3" ry="1.3" transform="rotate(-30 7.4 8.2)" fill="url(#refletG)"/>
      </svg>
    </div>
    <h1>Advent Calendar</h1>
    <p class="sous-titre">for my love</p>
    <form class="mdp-form" id="form-mdp" autocomplete="off">
      <input type="password" id="mdp" placeholder="Password" aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit" aria-label="Open">&rarr;</button>
    </form>
    <p class="mdp-msg" id="mdp-msg" role="status"></p>
  </div>
  <header class="top">
    <h1 id="titre">Advent Calendar</h1>
    <p class="sous-titre" id="sous-titre">for my love</p>
    <p class="compteur" id="compteur"></p>
  </header>

  <main>
    <div class="grille" id="grille"></div>
  </main>

  <footer class="pied" id="pied"></footer>

  <div class="scene" id="scene" hidden>
    <button class="fermer" id="fermer" aria-label="Close">&times;</button>
    <div class="scene-inner" id="scene-inner"></div>
    <p class="consigne" id="consigne"></p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
